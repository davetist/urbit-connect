  "components": {
    "securitySchemes": {
      "bearer": {
        "type": "http",
        "scheme": "bearer"
      },
      "ownerCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "urbauth-<ship>",
        "description": "Eyre-authenticated local owner, never an EAuth visitor; mutations also require bound CSRF and exact Origin."
      }
    },
    "schemas": {
      "Revision": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]{0,127})$"
      },
      "UUID": {
        "type": "string",
        "pattern": "^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$"
      },
      "Collection": {
        "type": "string",
        "pattern": "^[a-z][a-z0-9-]{0,47}$"
      },
      "JSONObject": {
        "type": "object",
        "additionalProperties": true,
        "description": "Strict portable JSON: depth <=16 across request, duplicate decoded UTF-8 keys forbidden, no U+0000, finite numbers with absolute value <=9007199254740991, exponent and fractional digit count <=1024. Numeric lexemes preserved."
      },
      "Document": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$"
          },
          "collection": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{0,47}$"
          },
          "data": {
            "$ref": "#/components/schemas/JSONObject"
          },
          "revision": {
            "type": "string",
            "pattern": "^(0|[1-9][0-9]{0,127})$"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "collection",
          "data",
          "revision",
          "updatedAt"
        ],
        "additionalProperties": false
      },
      "Put": {
        "type": "object",
        "properties": {
          "type": {
            "const": "put"
          },
          "collection": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{0,47}$"
          },
          "id": {
            "type": "string",
            "pattern": "^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$"
          },
          "data": {
            "$ref": "#/components/schemas/JSONObject"
          },
          "expectedRevision": {
            "oneOf": [
              {
                "type": "string",
                "pattern": "^(0|[1-9][0-9]{0,127})$"
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "required": [
          "type",
          "collection",
          "id",
          "data",
          "expectedRevision"
        ],
        "additionalProperties": false
      },
      "Delete": {
        "type": "object",
        "properties": {
          "type": {
            "const": "delete"
          },
          "collection": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{0,47}$"
          },
          "id": {
            "type": "string",
            "pattern": "^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$"
          },
          "expectedRevision": {
            "type": "string",
            "pattern": "^(0|[1-9][0-9]{0,127})$"
          }
        },
        "required": [
          "type",
          "collection",
          "id",
          "expectedRevision"
        ],
        "additionalProperties": false
      },
      "Mutation": {
        "type": "object",
        "properties": {
          "requestId": {
            "type": "string",
            "pattern": "^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$"
          },
          "operations": {
            "type": "array",
            "minItems": 1,
            "maxItems": 32,
            "items": {
              "oneOf": [
                {
                  "$ref": "#/components/schemas/Put"
                },
                {
                  "$ref": "#/components/schemas/Delete"
                }
              ]
            }
          }
        },
        "required": [
